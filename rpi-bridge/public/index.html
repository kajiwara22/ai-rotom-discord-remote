<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ai-rotoM</title>
<link rel="stylesheet" href="/public/mvp.css">
<style>
html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; }
#app { display: flex; flex-direction: column; height: 100vh; }
header {
  display: flex; align-items: center; gap: 0.75rem;
  padding: 0.5rem 1rem;
  border-bottom: 1px solid var(--color-bg-secondary);
  background: var(--color-bg);
  flex-shrink: 0;
}
header select { margin: 0; max-width: 200px; }
header label { margin: 0; display: flex; align-items: center; gap: 0.5rem; }
header h1 { font-size: 1.2rem; margin: 0; white-space: nowrap; }

#main { display: flex; flex: 1; overflow: hidden; }
#sidebar {
  width: 260px; flex-shrink: 0;
  border-right: 1px solid var(--color-bg-secondary);
  display: flex; flex-direction: column;
  overflow: hidden;
}
#sidebar > button {
  margin: 0.5rem;
  flex-shrink: 0;
}
#session-list {
  flex: 1; overflow-y: auto;
  padding: 0.25rem 0.5rem;
}
.session-item {
  padding: 0.5rem 0.75rem;
  cursor: pointer;
  border-radius: 6px;
  margin-bottom: 2px;
  word-break: break-all;
}
.session-item:hover { background: var(--color-bg-secondary); }
.session-item.active { background: var(--color-bg-secondary); font-weight: 600; }
.session-name { font-size: 0.875rem; line-height: 1.3; }
.session-time { font-size: 0.75rem; color: var(--color-secondary); }
.no-sessions { padding: 1rem; text-align: center; color: var(--color-secondary); font-size: 0.875rem; }

#chat-area {
  flex: 1; display: flex; flex-direction: column;
  min-width: 0;
}
#messages {
  flex: 1; overflow-y: auto;
  padding: 1rem;
}
#loading {
  display: none;
  justify-content: center; align-items: center;
  padding: 1rem; color: var(--color-secondary);
}
#loading.active { display: flex; }
.spinner {
  width: 24px; height: 24px;
  border: 3px solid var(--color-bg-secondary);
  border-top-color: var(--color-primary);
  border-radius: 50%;
  animation: spin 0.6s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

#input-area {
  border-top: 1px solid var(--color-bg-secondary);
  padding: 0.75rem;
  display: flex; gap: 0.5rem;
  flex-shrink: 0;
}
#input-area input {
  flex: 1; margin: 0;
}
#input-area button { margin: 0; flex-shrink: 0; }

#no-chat {
  flex: 1; display: flex;
  justify-content: center; align-items: center;
  color: var(--color-secondary);
}

#prompt-dialog textarea {
  width: 100%; min-height: 200px; font-size: 0.875rem;
  font-family: monospace;
}

.msg { margin-bottom: 0.75rem; }
.msg-user { }
.msg-assistant { }
.msg-label {
  font-size: 0.75rem; color: var(--color-secondary);
  margin-bottom: 0.15rem;
}

@media (max-width: 600px) {
  #sidebar { width: 200px; }
}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>ai-rotoM</h1>
    <label>
      ユーザー:
      <select id="user-select"></select>
    </label>
    <button id="settings-btn" type="button" style="margin-left:auto">設定</button>
  </header>
  <main id="main">
    <nav id="sidebar">
      <button id="new-chat-btn" type="button">＋ 新規チャット</button>
      <div id="session-list"></div>
    </nav>
    <div id="chat-area">
      <div id="no-chat">左の「新規チャット」またはセッションを選択してください</div>
      <div id="messages"></div>
      <div id="loading"><span class="spinner"></span>&nbsp;考え中...</div>
      <form id="input-area" autocomplete="off">
        <input id="message-input" type="text" placeholder="メッセージを入力..." disabled>
        <button id="send-btn" type="submit" disabled>送信</button>
      </form>
    </div>
  </main>
</div>

<dialog id="prompt-dialog">
  <form method="dialog">
    <h2>システムプロンプト設定</h2>
    <p class="hint">このプロンプトがAIの応答スタイルを決めます。空欄にするとデフォルトに戻ります。</p>
    <textarea id="prompt-textarea" rows="12"></textarea>
    <footer>
      <button id="prompt-save" type="button">保存</button>
      <button type="reset" formmethod="dialog">キャンセル</button>
    </footer>
  </form>
</dialog>

<script src="/public/marked.js"></script>
<script src="/public/app.js"></script>
</body>
</html>
