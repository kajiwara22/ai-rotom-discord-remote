name: typecheck

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: typecheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: worker
            install: npm ci --ignore-scripts --no-audit --no-fund
            check: npx tsc --noEmit
          - package: rpi-bridge
            install: pnpm install --frozen-lockfile --ignore-scripts
            check: pnpm exec tsc --noEmit
    steps:
      - uses: actions/checkout@v7

      # node と pnpm のバージョンは .mise.toml を正とする（Renovate が更新する）。
      - uses: jdx/mise-action@v5

      # 型チェックだけなので install script は動かさない。
      # better-sqlite3 / esbuild のビルドを挟まず CI を速く保つ。
      - name: install
        working-directory: ${{ matrix.package }}
        run: ${{ matrix.install }}

      - name: tsc --noEmit
        working-directory: ${{ matrix.package }}
        run: ${{ matrix.check }}
