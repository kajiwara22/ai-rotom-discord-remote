name: typecheck

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: typecheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [worker, rpi-bridge]
    steps:
      - uses: actions/checkout@v7

      # node と pnpm のバージョンは .mise.toml を正とする（Renovate が更新する）。
      - uses: jdx/mise-action@v5

      # 型チェックだけなので install script は動かさない。
      # better-sqlite3 / esbuild のビルドを挟まず CI を速く保つ。
      - name: install (worker)
        if: matrix.package == 'worker'
        working-directory: worker
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: install (rpi-bridge)
        if: matrix.package == 'rpi-bridge'
        working-directory: rpi-bridge
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: tsc --noEmit
        working-directory: ${{ matrix.package }}
        run: npx tsc --noEmit
