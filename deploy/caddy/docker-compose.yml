services:
  caddy:
    build: .
    image: ai-rotom-caddy:latest
    container_name: ai-rotom-caddy
    restart: unless-stopped

    # ホストネットワークを使う。
    # - 80/443 をそのまま待ち受けられる
    # - reverse_proxy 先の 127.0.0.1:3210（rpi-bridge）にコンテナから直接届く
    #   ため、rpi-bridge を LAN に晒す（BIND_HOST=0.0.0.0）必要がなくなる
    network_mode: host

    # 環境変数はシェルから受け取る。
    # mise の [env]（.mise.local.toml）で設定するのが既定だが、素の export でも、
    # このディレクトリに .env を置いても動く（compose が自動で読み込むため）。
    # 未設定のまま起動すると :? の右側が表示されて失敗する。
    environment:
      BASE_DOMAIN: ${BASE_DOMAIN:?未設定です。.mise.local.toml を用意してください}
      ROTOM_HOST: ${ROTOM_HOST:?未設定です。.mise.local.toml を用意してください}
      ACME_EMAIL: ${ACME_EMAIL:?未設定です。.mise.local.toml を用意してください}
      CF_API_TOKEN: ${CF_API_TOKEN:?未設定です。.mise.local.toml を用意してください}

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # 取得済み証明書と ACME アカウント鍵。
      # ここを消すと証明書を取り直すことになり、Let's Encrypt の
      # レート制限（同一ドメイン 週 50 枚）に当たる恐れがある。必ず永続化する。
      - caddy_data:/data
      - caddy_config:/config
      - ./logs:/var/log/caddy

volumes:
  caddy_data:
  caddy_config:
