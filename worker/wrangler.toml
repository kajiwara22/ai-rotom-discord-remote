name = "ai-rotom-discord-remote"
main = "src/index.ts"
compatibility_date = "2025-07-15"
compatibility_flags = ["nodejs_compat"]

[vars]
# DISCORD_PUBLIC_KEY = ""
# DISCORD_APPLICATION_ID = ""
# DISCORD_TOKEN = ""
PI_BRIDGE_URL = "https://ai-rotom-bridge.kajilab.work"
# ALLOWED_CHANNEL_IDS = ""

[[migrations]]
tag = "v2"
deleted_classes = ["ConversationSession"]

[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true

[observability.traces]
enabled = false
